<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Mis XV Jimena</title>

    <link
        rel="stylesheet"
        href="css/style.css?v=12">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap"
        rel="stylesheet">

</head>

<body>


    <!-- =====================================
         INTRO
    ====================================== -->

    <main
        class="intro"
        id="intro">


        <!-- =====================================
             PAISAJE FINAL
             Queda detrás de la portada
        ====================================== -->

        <div
            class="vista-previa-invitacion"
            aria-hidden="true">

            <img
                src="assets/img/fondo-invitacion.png"
                alt="Paisaje de Santorini">

        </div>


        <!-- =====================================
             CÁMARA
        ====================================== -->

        <div
            class="camara"
            id="camara">


            <!-- =====================================
                 FONDO
            ====================================== -->

            <img
                src="assets/img/fondo-pared-intro3.webp"
                class="fondo-pared"
                alt=""
                loading="lazy">


            <!-- =====================================
                 ESCENA DE LA PUERTA
            ====================================== -->

            <section
                class="escena"
                id="escenaPuerta"
                aria-label="Puerta de entrada">


                <!-- =================================
                     INTERIOR
                ================================== -->

                <div
                    class="interior"
                    id="interiorPuerta"
                    aria-hidden="true">

                    <img
                        src="assets/img/fondo-invitacion.png"
                        class="paisaje-puerta"
                        alt=""
                        loading="lazy">

                </div>


                <!-- =================================
                     PUERTA IZQUIERDA
                ================================== -->

                <img
                    src="assets/img/puerta-izquierda.png"
                    class="capa-completa puerta puerta-izquierda"
                    alt="">


                <!-- =================================
                     PUERTA DERECHA
                ================================== -->

                <img
                    src="assets/img/puerta-derecha.png"
                    class="capa-completa puerta puerta-derecha"
                    alt="">


                <!-- =================================
                     MARCO
                ================================== -->

                <img
                    src="assets/img/marco-grada.png"
                    class="capa-completa marco-grada"
                    alt=""
                    loading="lazy">


                <!-- =================================
                     FLORES SUPERIORES
                ================================== -->

                <img
                    src="assets/img/buganvilias_transparente.webp"
                    class="flores-superiores"
                    alt="">


                <!-- =================================
                     FLORERO IZQUIERDO
                ================================== -->

                <img
                    src="assets/img/florero-izquierdo2.png"
                    class="florero florero-izquierdo"
                    alt=""
                    loading="lazy">


                <!-- =================================
                     FLORERO DERECHO
                ================================== -->

                <img
                    src="assets/img/florero-izquierdo2.png"
                    class="florero florero-derecho"
                    alt=""
                    loading="lazy">


                <!-- =================================
                     LETRERO XV AÑOS
                ================================== -->

                <img
                    src="assets/img/xv-anios.png"
                    class="letrero-xv"
                    alt="XV años"
                    loading="lazy">


                <!-- =================================
                     FAROL
                ================================== -->

                <img
                    src="assets/img/farol.png"
                    class="farol"
                    alt="Farol"
                    loading="lazy">


            </section>

        </div>


        <!-- =====================================
             BOTÓN ENTRAR
        ====================================== -->

        <div
            class="boton-entrar"
            id="botonAbrir"
            role="button"
            tabindex="0"
            aria-label="Abrir la puerta">


            <img
                src="assets/img/Frame.png"
                class="marco-boton"
                alt="">


            <div class="contenido-boton">


                <span class="rombo">
                    ❖
                </span>


                <span class="texto-boton">
                    Toca la puerta para entrar
                </span>


                <span class="rombo">
                    ❖
                </span>


            </div>

        </div>


    </main>


    <!-- =====================================
         MÚSICA
    ====================================== -->

    <audio
        id="musica"
        preload="auto"
        loop>

        <source
            src="assets/audio/ABBA - Mamma Mia.mp3"
            type="audio/mpeg">

    </audio>


    <!-- =====================================
         PÉTALOS
         16 PÉTALOS
    ====================================== -->

    <div
        class="petalos"
        aria-hidden="true">


        <!-- PÉTALOS ORIGINALES -->

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>


        <!-- PÉTALOS NUEVOS -->

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="js/script.js?v=12"></script>


</body>

</html>
